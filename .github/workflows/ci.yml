name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Lint, type-check, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Generates .nuxt (incl. the tsconfig vue-tsc resolves). npm ci runs this
      # via the postinstall hook too; kept explicit so the type-check never runs
      # against a missing .nuxt.
      - name: Prepare Nuxt
        run: npx nuxi prepare

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx vue-tsc --noEmit

      - name: Test
        run: npm test
